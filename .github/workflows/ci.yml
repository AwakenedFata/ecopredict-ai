name: EcoPredict AI CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Test Suite & AI Pipeline Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify Model Weights & Database Integrity
        run: |
          python -c "import os; assert os.path.exists('ai/weights/lgbm_rul_model.pkl'), 'Model weights missing'"
          python -c "import sqlite3; conn = sqlite3.connect('electronic_fleet.db'); c = conn.cursor().execute('SELECT COUNT(*) FROM asset_devices').fetchone(); assert c[0] == 120, 'Devices count invalid'"

      - name: Execute Automated Pytest Suite
        run: |
          pytest tests/ -v
