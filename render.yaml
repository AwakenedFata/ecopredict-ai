services:
  - type: web
    name: ecopredict-ai
    runtime: python
    buildCommand: pip install -r requirements.txt && python core/seeder.py && python ai/pipeline.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLEET_DB_PATH
        value: electronic_fleet.db
